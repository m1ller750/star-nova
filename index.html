<!doctype html>
<html lang="en">
<head>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="cine"></canvas>
  <div id="ui"></div>
  <div id="boot">
    <div class="boot-title">STAR NOVA</div>
    <div class="boot-sub">LOADING SYSTEMS…</div>
    <div class="boot-err" id="boot-err"></div>
  </div>
  <script>
    window.addEventListener('error', function (e) {
      var el = document.getElementById('boot-err');
      if (el) el.textContent = 'Error: ' + (e.message || e.error);
      console.error(e.error || e.message);
    });
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
